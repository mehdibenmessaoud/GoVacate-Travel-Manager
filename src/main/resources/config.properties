# Configuration pour l'envoi d'emails (mot de passe oublié)
# Copiez ce fichier en config.local.properties et ajoutez vos clés (ne pas committer config.local.properties)

# Brevo (Sendinblue) - Créez un compte gratuit sur https://www.brevo.com
# Clé API : Paramètres > Clés API > Créer une clé
# govacate.brevo.api.key=xkeysib-xxxxxxxxxxxxxxxxxxxxxxxxxx

# Adresse email de l'expéditeur (doit être vérifiée dans Brevo)
# govacate.brevo.sender.email=noreply@votredomaine.com
# govacate.brevo.sender.name=GoVacate

# En mode développement (sans clé API), le code s'affiche directement à l'écran
